name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Chaquopy necesita un intérprete Python 3.10 en el runner.
      - uses: actions/setup-python@v5
        id: setup_python
        with:
          python-version: '3.10'
          check-latest: true

      # El runner ya trae el Android SDK; solo aceptamos licencias por las dudas
      - name: Aceptar licencias del SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Configurar local.properties (TMDB opcional)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          printf 'sdk.dir=%s\\n' "$ANDROID_HOME" > local.properties
          if [ -n "$TMDB_API_KEY" ]; then
            printf 'TMDB_API_KEY=%s\\n' "$TMDB_API_KEY" >> local.properties
          fi

      - name: Compilar APK (release rápido, firmado con la clave del proyecto)
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_EXE="$(python -c 'import sys; print(sys.executable)')"
          python -c 'import sys; assert sys.version_info[:2] == (3, 10), f"Se requiere Python 3.10 para Chaquopy; encontrado: {sys.version}"'
          echo "Python de Chaquopy: $PYTHON_EXE"
          gradle assembleRelease --no-daemon "-PchaquopyBuildPython=$PYTHON_EXE"

      - uses: actions/upload-artifact@v4
        with:
          name: XuperQuilmesTV-apk
          path: app/build/outputs/apk/release/*.apk
