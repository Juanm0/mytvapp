name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Instalar Android SDK 36, compatible con AGP 8.10.1.
      - name: Instalar Android SDK 36 y aceptar licencias
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Configurar local.properties (TMDB opcional)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          if [ -n "$TMDB_API_KEY" ]; then
            printf 'TMDB_API_KEY=%s\n' "$TMDB_API_KEY" >> local.properties
          fi

      # El AAR 0.1.3 contiene el motor Rust/JNI de Brave y las reglas de recursos cosméticos.
      # Su metadata declara compileSdk 37 aunque el wrapper no necesita APIs Java nuevas;
      # se consume como AAR local y se ajusta la metadata a SDK 36, disponible en CI.
      - name: Preparar AAR nativo de Brave adblock-rust
        run: |
          mkdir -p app/libs /tmp/adblock-aar
          curl --fail --location --retry 3 \
            https://repo.maven.apache.org/maven2/io/github/mlm-games/adblock/0.1.3/adblock-0.1.3.aar \
            --output app/libs/adblock-0.1.3.aar
          cd /tmp/adblock-aar
          unzip -q "$GITHUB_WORKSPACE/app/libs/adblock-0.1.3.aar"
          if [ -f META-INF/com/android/build/gradle/aar-metadata.properties ]; then
            sed -i 's/^minCompileSdkVersion=37$/minCompileSdkVersion=36/' META-INF/com/android/build/gradle/aar-metadata.properties
            sed -i 's/^minCompileSdk=37$/minCompileSdk=36/' META-INF/com/android/build/gradle/aar-metadata.properties
          fi
          zip -qr "$GITHUB_WORKSPACE/app/libs/adblock-0.1.3.aar" .

      - name: Compilar APK (release rápido, firmado con la clave del proyecto)
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: XuperQuilmesTV-apk
          path: app/build/outputs/apk/release/*.apk
